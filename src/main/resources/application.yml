spring:
  application:
    name: petit-caillou-service

  # Loads the local .env file when present. Absent in CI or production, where the
  # same keys are supplied as real environment variables.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # DB_SSL_MODE: disable, trust, verify-ca or verify-full. Raise it to
    # verify-full as soon as the server accepts TLS.
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petit_caillou}?sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:petit_caillou}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: petit-caillou-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    # Flyway owns the schema, Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuse to adopt a database that already contains tables. A misconfigured
    # DB_HOST then fails at startup instead of migrating the wrong schema.
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

petit-caillou:
  jwt:
    # HMAC-SHA256 secret, at least 32 bytes. The default is for local dev only;
    # production must supply a real JWT_SECRET from the environment.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
    issuer: petit-caillou-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: info
