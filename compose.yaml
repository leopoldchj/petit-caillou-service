# Local MariaDB, matching the 10.11 series used on the target server.
# Start it with: docker compose up -d
services:
  mariadb:
    image: mariadb:10.11
    container_name: petit-caillou-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-petit_caillou}
      MARIADB_USER: ${DB_USERNAME:-petit_caillou}
      MARIADB_PASSWORD: ${DB_PASSWORD:-petit_caillou}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
